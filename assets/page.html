<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#F4F2EE; --surface:#FBFAF7; --dp-tint:#EEF5FB; --ink:#111820; --ink2:#2B3440; --muted:#5A6270;
  --line:#E2DED6; --chip:#ECE9E3; --blue:#2F86C4; --pink:#C23D68; --gold:#E9A82A;
  --ok:#2E7D4F; --ok-bg:#E3F1E8; --warn-bg:#F8E4EA;
  --grad:linear-gradient(90deg,#3895d3,#cf4370 55%,#f8b93e);
  --sans:"Prompt",system-ui,"Leelawadee UI","Noto Sans Thai",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --ground:#0E141B; --surface:#151E28; --dp-tint:#13263A; --ink:#E9EDF2; --ink2:#C9D1DB; --muted:#8C97A5;
    --line:#26323F; --chip:#1E2935; --ok:#6FCF97; --ok-bg:#16301F; --warn-bg:#3A1A24; --blue:#5FB0E6; --pink:#E8749A; --gold:#F8C25E;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#0E141B; --surface:#151E28; --dp-tint:#13263A; --ink:#E9EDF2; --ink2:#C9D1DB; --muted:#8C97A5;
  --line:#26323F; --chip:#1E2935; --ok:#6FCF97; --ok-bg:#16301F; --warn-bg:#3A1A24; --blue:#5FB0E6; --pink:#E8749A; --gold:#F8C25E;}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:28px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600}
p{margin:0}

/* header */
.head{display:grid;gap:14px;padding-bottom:22px;border-bottom:3px solid transparent;border-image:var(--grad) 1}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.head h1{font-size:clamp(30px,5vw,46px);line-height:1.15;letter-spacing:-.01em}
.head h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:var(--ink2);max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:12.5px}
.meta a{color:var(--blue)}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:10px}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:13.5px;border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.copy{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.copy:hover{border-color:var(--blue)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.toast{font-size:13px;color:var(--blue);min-width:8ch}

/* summary */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sum div{background:var(--surface);padding:16px 18px;display:grid;gap:6px;align-content:start}
.sum h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sum p{font-size:14px;color:var(--ink2)}

/* table */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th.col-dp{color:var(--blue)}
td{vertical-align:top;padding:14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.c-n{width:40px}
.num{font-family:var(--mono);font-size:13px;color:var(--muted)}
.c-img{width:136px}
.c-img img{display:block;width:108px;height:auto;aspect-ratio:9/16;object-fit:cover;border-radius:6px;max-width:100%}
.c-t{width:84px;white-space:nowrap}
.tc{display:block;font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.dur{display:block;font-size:12px;color:var(--muted)}
.c-cam{width:120px}
.chip{display:inline-block;font-size:11.5px;background:var(--chip);color:var(--ink2);padding:2px 8px;border-radius:4px;margin:0 4px 4px 0;white-space:nowrap}
.col-orig,.col-dp{width:36%;display:table-cell}
td.col-dp{background:var(--dp-tint)}
.desc{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.vo{font-size:15px;color:var(--ink)}
.vo.en{font-size:14px;color:var(--ink2)}
.vo.th{font-size:13.5px;color:var(--muted);margin-top:4px}
.vo.dpvo{font-weight:500;font-size:16px;line-height:1.55}
.ost{font-size:13px;color:var(--ink2);margin-top:10px}
.ost span{font-size:11px;letter-spacing:.06em;color:var(--pink);font-weight:500;margin-right:8px}
.note{font-size:12.5px;color:var(--muted);margin-top:6px;font-style:italic}

body.v-dp .col-orig, body.v-orig .col-dp{display:none}
body.v-dp .col-dp, body.v-orig .col-orig{width:auto}

.wc{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:500;padding:1px 7px;border-radius:4px;background:var(--chip);color:var(--muted);vertical-align:2px;white-space:nowrap;margin-left:4px}
.wc.ok{background:var(--ok-bg);color:var(--ok)}
.wc.off{background:var(--warn-bg);color:var(--pink)}
.lb{display:inline-block;font-size:11px;letter-spacing:.06em;color:var(--blue);font-weight:500;margin-right:8px}
.vo.th{font-size:14.5px;color:var(--ink);margin-top:8px}
.brief{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.brief div{background:var(--surface);padding:16px 18px;display:grid;gap:8px;align-content:start}
.brief div.dp{background:var(--dp-tint)}
.brief h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.brief div.dp h3{color:var(--blue)}
.brief p{font-size:14.5px}
.brief .cta{font-size:12.5px;color:var(--muted)}
.brief .cta b{color:var(--ink);font-weight:500}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:20px}
.sec-h p{font-size:13px;color:var(--muted)}
.count{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.count b{font-family:var(--mono);font-size:20px;color:var(--ink);font-weight:500;margin-right:4px}
.count .dpc b{color:var(--blue)}
/* notes */
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.notes section{display:grid;gap:10px;align-content:start}
.notes h2{font-size:18px}
.notes ul{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--ink2);font-size:14px}
.notes li::marker{color:var(--pink)}
.tag{font-family:var(--mono);font-size:12px;color:var(--blue);margin-right:6px}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}

@media (max-width:860px){
  .sum,.notes,.brief{grid-template-columns:1fr}
  .tbl{border:0;background:transparent;overflow:visible}
  table,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{display:grid;grid-template-columns:96px 1fr;gap:4px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  td{border:0;padding:0;width:auto!important}
  .c-n{grid-column:2;grid-row:1}
  .c-img{grid-column:1;grid-row:1/4}
  .c-img img{width:96px}
  .c-t{grid-column:2;grid-row:2}
  .c-cam{grid-column:2;grid-row:3}
  .col-orig,.col-dp{grid-column:1/-1;padding:12px;border-radius:8px;margin-top:8px}
  td.col-orig{background:var(--ground)}
  .col-orig::before,.col-dp::before{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin-bottom:6px}
  .col-orig::before{content:"ต้นฉบับ Superside";color:var(--muted)}
  .col-dp::before{content:"เวอร์ชัน DP Studio";color:var(--blue)}
  body.v-dp .col-dp, body.v-orig .col-orig{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body.no-adapt .col-dp, body.no-adapt .adapt-only{display:none!important}
body.no-adapt .col-orig{width:auto}
.brief.two{grid-template-columns:repeat(2,1fr)}
</style>

<script>document.body.className="{{BODYCLASS}}";</script>
<div class="wrap">
  <header class="head">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{H1}}</h1>
    <p class="lede">{{LEDE}}</p>
    <div class="meta">{{META}}</div>
  </header>

  <section class="sum" aria-label="สรุปต้นฉบับ">{{SUMMARY}}</section>

{{BRIEF}}

  <section style="display:grid;gap:12px" aria-label="บทพูด">
    <div class="sec-h"><h2>บทพูดทีละช็อต</h2><div class="count">{{COUNT}}</div></div>
  </section>

  <div class="bar">
    <div class="seg adapt-only" role="group" aria-label="มุมมองตาราง">
      <button id="v-both" type="button" aria-pressed="true" data-v="">เทียบกัน</button>
      <button id="v-dp" type="button" aria-pressed="false" data-v="v-dp">{{ADAPT_SHORT}}</button>
      <button id="v-orig" type="button" aria-pressed="false" data-v="v-orig">ต้นฉบับ</button>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="toast" id="toast" aria-live="polite"></span>
      <button class="copy" id="copydoc" type="button">คัดลอกตารางไป Docs</button>
      <button class="copy" id="copy" type="button">{{COPY_LABEL}}</button>
    </div>
  </div>

  <div class="tbl">
    <table>
      <thead><tr><th>#</th><th>ภาพต้นฉบับ</th><th>เวลา</th><th>กล้อง</th><th class="col-orig">{{SRC_HEAD}}</th><th class="col-dp">{{ADAPT_HEAD}}</th></tr></thead>
      <tbody>
{{ROWS}}
      </tbody>
    </table>
  </div>

{{NOTES}}

  <p class="foot">{{FOOT}}</p>
</div>

<div id="copysrc" aria-hidden="true" style="position:fixed;left:-99999px;top:0;width:1000px;background:#fff;color:#000">{{COPYTBL}}</div>
<script type="application/json" id="dptext">{{DPTEXT}}</script>
<script>
(function(){
  var btns=document.querySelectorAll('.seg button');
  function setView(v){
    document.body.classList.remove('v-dp','v-orig'); if(v) document.body.classList.add(v);
    btns.forEach(function(b){b.setAttribute('aria-pressed', b.dataset.v===v ? 'true':'false');});
    try{localStorage.setItem('vdoscript-view', v);}catch(e){}
  }
  btns.forEach(function(b){b.addEventListener('click',function(){setView(b.dataset.v);});});
  if(!document.body.classList.contains('no-adapt')){try{var s=localStorage.getItem('vdoscript-view'); if(s!==null) setView(s);}catch(e){}}

  var text=JSON.parse(document.getElementById('dptext').textContent);
  var toast=document.getElementById('toast');
  function say(m){toast.textContent=m; setTimeout(function(){toast.textContent='';},2500);}
  document.getElementById('copydoc').addEventListener('click',function(){
    var src=document.getElementById('copysrc');
    function fallback(){
      var sel=window.getSelection(), r=document.createRange(); r.selectNodeContents(src);
      sel.removeAllRanges(); sel.addRange(r);
      var ok=false; try{ok=document.execCommand('copy');}catch(e){}
      sel.removeAllRanges(); say(ok?'คัดลอกตารางแล้ว วางใน Docs ได้เลย':'คัดลอกไม่ได้ ใช้ไฟล์ Word แทน');
    }
    try{
      if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
        var item=new ClipboardItem({'text/html':new Blob([src.innerHTML],{type:'text/html'}),'text/plain':new Blob([src.innerText],{type:'text/plain'})});
        navigator.clipboard.write([item]).then(function(){say('คัดลอกตารางแล้ว วางใน Docs ได้เลย');}, fallback);
      } else fallback();
    }catch(e){fallback();}
  });
  document.getElementById('copy').addEventListener('click',function(){
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly','');
      ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
      var ok=false; try{ok=document.execCommand('copy');}catch(e){}
      document.body.removeChild(ta); say(ok?'คัดลอกแล้ว':'คัดลอกไม่ได้ ลองเลือกข้อความเอง');
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){say('คัดลอกแล้ว');}, fallback);
    } else fallback();
  });
})();
</script>
